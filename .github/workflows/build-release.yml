# Build & Release: builds the game into an offline-ready zip, tests it, publishes it as a
# new versioned GitHub Release, and deploys it to GitHub Pages.
#  - Pull requests into main: check, build, smoke test, and attach the zip to the run (no release).
#  - Every merge into main: the same, then publish the next version (v1.0.0, v1.0.1, ...) as a
#    GitHub Release with the zip attached. Bump "version" in package.json for minor/major releases.
#  - Pushing a v* tag by hand, or "Run workflow" from the Actions tab, also works.
#  - Every merge into main (and "Run workflow" on main) also deploys dist/ to GitHub Pages, so the
#    game is playable at https://<owner>.github.io/<repo>/. Tags and pull requests never deploy.
#    One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#  - Desktop (Electron, for Steam): after the web build passes, the same dist/ is packaged into
#    unpacked app folders on Windows (x64), Linux (x64) and macOS (universal), each zipped as
#    landed-<version>-<platform>.zip, boot-tested (the packaged app must reach window.G), and
#    attached to the run. Releases wait for all three and attach them too, so a release is always
#    complete: a desktop failure blocks the release (GitHub Pages still deploys the web build).
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Releases from main run one at a time so two quick merges can't claim the same version.
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check, build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      pages: ${{ steps.version.outputs.pages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to work out the next version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"; release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            version="$(node scripts/next-version.mjs)"; release=true
          else
            version="$(git rev-parse --short HEAD)"; release=false
          fi
          # GitHub Pages: deploy only reviewed code on main (merges and "Run workflow"). Never tags or PRs.
          pages=false
          if [[ "$GITHUB_REF" == "refs/heads/main" && ( "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ) ]]; then
            pages=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "Version: $version (release: $release, pages: $pages)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm test

      - name: Package release zip
        run: |
          mkdir -p release
          name="landed-${{ steps.version.outputs.version }}"
          cp -r dist "release/$name"
          (cd release && zip -qr "$name.zip" "$name")
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: landed-${{ steps.version.outputs.version }}
          path: release/*.zip
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: steps.version.outputs.pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desktop:
    name: Desktop build (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false # see every platform's result, not just the first failure
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            out: linux-unpacked
            exe: landed
          - os: windows-latest
            platform: windows-x64
            out: win-unpacked
            exe: Landed.exe
          - os: macos-latest
            platform: macos-universal
            out: mac-universal
            exe: Landed.app/Contents/MacOS/Landed
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm run desktop:install

      - name: Build desktop app
        run: npm run desktop:build
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}

      - name: Package desktop zip
        id: package
        env:
          OUT: ${{ matrix.out }}
          EXE: ${{ matrix.exe }}
        run: |
          name="landed-$VERSION-$PLATFORM"
          mkdir -p release
          mv "export/desktop/$OUT" "release/$name"
          cd release
          case "$RUNNER_OS" in
            macOS) ditto -c -k --sequesterRsrc --keepParent "$name" "$name.zip" ;; # keeps the .app's symlinks
            Windows) 7z a -tzip -bso0 "$name.zip" "$name" ;;
            *) zip -qry "$name.zip" "$name" ;;
          esac
          ls -l
          echo "exe=release/$name/$EXE" >> "$GITHUB_OUTPUT"
          echo "dir=release/$name" >> "$GITHUB_OUTPUT"

      - name: Smoke test (packaged app boots)
        env:
          EXE: ${{ steps.package.outputs.exe }}
          APP_DIR: ${{ steps.package.outputs.dir }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            command -v xvfb-run >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends xvfb; }
            # Ubuntu blocks unprivileged user namespaces, so Chromium's sandbox needs its setuid helper.
            # Done after zipping, on the test copy only: the zip keeps the plain file.
            sudo chown root:root "$APP_DIR/chrome-sandbox"
            sudo chmod 4755 "$APP_DIR/chrome-sandbox"
          fi
          npm run desktop:smoke -- "$EXE"

      - uses: actions/upload-artifact@v4
        with:
          name: landed-${{ needs.build.outputs.version }}-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, desktop]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # The web zip (landed-<version>) and the three desktop zips (landed-<version>-<platform>).
          pattern: landed-${{ needs.build.outputs.version }}*
          merge-multiple: true
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists (re-run of a released commit); nothing to publish."
            exit 0
          fi
          gh release create "$VERSION" release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Landed $VERSION" \
            --generate-notes

  pages:
    name: Deploy to GitHub Pages
    needs: build
    # Independent of the release job: a Pages failure doesn't block the release, and vice versa.
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      # One Pages deploy at a time; never cancel one mid-flight.
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
