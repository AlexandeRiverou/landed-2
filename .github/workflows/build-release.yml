# Build & Release: builds the game into an offline-ready zip, tests it, and publishes it as a
# new versioned GitHub Release.
#  - Pull requests into main: check, build, smoke test, and attach the zip to the run (no release).
#  - Every merge into main: the same, then publish the next version (v1.0.0, v1.0.1, ...) as a
#    GitHub Release with the zip attached. Bump "version" in package.json for minor/major releases.
#  - Pushing a v* tag by hand, or "Run workflow" from the Actions tab, also works.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Releases from main run one at a time so two quick merges can't claim the same version.
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check, build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to work out the next version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"; release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            version="$(node scripts/next-version.mjs)"; release=true
          else
            version="$(git rev-parse --short HEAD)"; release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version: $version (release: $release)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm test

      - name: Package release zip
        run: |
          mkdir -p release
          name="landed-${{ steps.version.outputs.version }}"
          cp -r dist "release/$name"
          (cd release && zip -qr "$name.zip" "$name")
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: landed-${{ steps.version.outputs.version }}
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: landed-${{ needs.build.outputs.version }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists (re-run of a released commit); nothing to publish."
            exit 0
          fi
          gh release create "$VERSION" release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Landed $VERSION" \
            --generate-notes
